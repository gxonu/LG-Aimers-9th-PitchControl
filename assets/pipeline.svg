<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2d5a8c"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#f7f9fc"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="74" fill="url(#hdr)"/>
  <text x="40" y="34" fill="#fff" font-size="21" font-weight="700">KBO 투구 제구 성공 확률 예측 — 추론 파이프라인</text>
  <text x="40" y="58" fill="#b9d2ea" font-size="13.5">LG Aimers 9기 / DACON 236743 · Public LB 1,149.33 · 88위 / 2,403</text>
  <text x="1160" y="44" fill="#fff" font-size="15" font-weight="600" text-anchor="end">exp031h</text>



  <!-- input -->
  <rect x="40" y="112" width="152" height="96" rx="9" fill="#fff" stroke="#c8d4e2" filter="url(#sh)"/>
  <text x="116" y="140" font-size="13.5" font-weight="700" fill="#1e3a5f" text-anchor="middle">test 245,789행</text>
  <text x="116" y="162" font-size="11.5" fill="#5b6b7f" text-anchor="middle">2025 시즌</text>
  <text x="116" y="180" font-size="11.5" fill="#5b6b7f" text-anchor="middle">투구 직전 정보만</text>
  <text x="116" y="198" font-size="11.5" fill="#5b6b7f" text-anchor="middle">행 독립 보장</text>

  <!-- stage 1 anchor -->
  <rect x="236" y="100" width="212" height="120" rx="9" fill="#fff" stroke="#2d5a8c" stroke-width="2" filter="url(#sh)"/>
  <rect x="236" y="100" width="212" height="28" rx="9" fill="#2d5a8c"/>
  <rect x="236" y="118" width="212" height="10" fill="#2d5a8c"/>
  <text x="342" y="119" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">① Anchor 백본</text>
  <text x="342" y="150" font-size="11.5" fill="#33415c" text-anchor="middle">계층 base + CatBoost 3채널</text>
  <text x="342" y="169" font-size="11.5" fill="#33415c" text-anchor="middle">(decay .55/.55/.30)</text>
  <text x="342" y="188" font-size="11.5" fill="#33415c" text-anchor="middle">실패유형 hazard 3종</text>
  <text x="342" y="207" font-size="11.5" fill="#33415c" text-anchor="middle">+ depth-3 adaptive gate</text>

  <!-- stage 2 B1 -->
  <rect x="492" y="100" width="196" height="120" rx="9" fill="#fff" stroke="#2f855a" stroke-width="2" filter="url(#sh)"/>
  <rect x="492" y="100" width="196" height="28" rx="9" fill="#2f855a"/>
  <rect x="492" y="118" width="196" height="10" fill="#2f855a"/>
  <text x="590" y="119" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">② B1 잔차 (R행)</text>
  <text x="590" y="152" font-size="11.5" fill="#33415c" text-anchor="middle">독립 계열 백본 예측을</text>
  <text x="590" y="171" font-size="11.5" fill="#33415c" text-anchor="middle">입력으로 쓰는 얇은 잔차</text>
  <text x="590" y="196" font-size="12" font-weight="700" fill="#2f855a" text-anchor="middle">s = 0.50</text>
  <text x="590" y="213" font-size="10.5" fill="#7a8899" text-anchor="middle">3점 2차적합으로 정점 예측</text>

  <!-- stage 3 rm -->
  <rect x="732" y="100" width="196" height="120" rx="9" fill="#fff" stroke="#b7791f" stroke-width="2" filter="url(#sh)"/>
  <rect x="732" y="100" width="196" height="28" rx="9" fill="#b7791f"/>
  <rect x="732" y="118" width="196" height="10" fill="#b7791f"/>
  <text x="830" y="119" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">③ rm 잔차</text>
  <text x="830" y="152" font-size="11.5" fill="#33415c" text-anchor="middle">스택이 계수 ≈ 0 으로</text>
  <text x="830" y="171" font-size="11.5" fill="#33415c" text-anchor="middle">버린 risk_middle 을 복원</text>
  <text x="830" y="196" font-size="12" font-weight="700" fill="#b7791f" text-anchor="middle">β = −0.15</text>
  <text x="830" y="213" font-size="10.5" fill="#7a8899" text-anchor="middle">μ 동결 · 단일 최대 +13.0</text>

  <!-- stage 4 calib -->
  <rect x="972" y="100" width="188" height="120" rx="9" fill="#fff" stroke="#6b46a8" stroke-width="2" filter="url(#sh)"/>
  <rect x="972" y="100" width="188" height="28" rx="9" fill="#6b46a8"/>
  <rect x="972" y="118" width="188" height="10" fill="#6b46a8"/>
  <text x="1066" y="119" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">④ 캘리브레이션</text>
  <text x="1066" y="152" font-size="11.5" fill="#33415c" text-anchor="middle">세그먼트별 고정 logit shift</text>
  <text x="1066" y="171" font-size="11.5" fill="#33415c" text-anchor="middle">R / F 분리</text>
  <text x="1066" y="196" font-size="11.5" fill="#33415c" text-anchor="middle">학습시점 상수만 사용</text>
  <text x="1066" y="213" font-size="10.5" fill="#7a8899" text-anchor="middle">테스트 누수 없음</text>

  <!-- arrows row1 -->
  <line x1="196" y1="160" x2="230" y2="160" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="452" y1="160" x2="486" y2="160" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="692" y1="160" x2="726" y2="160" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="932" y1="160" x2="966" y2="160" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- residual math -->
  <rect x="236" y="256" width="924" height="56" rx="8" fill="#eef3f9" stroke="#d3dfec"/>
  <text x="698" y="282" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a5f" text-anchor="middle">p = clip( p_anchor  +  s · r_B1(x)  +  β · ( risk_middle(x) − μ ) ,  0, 1 )   →   logit-shift(b_R, b_F)</text>
  <text x="698" y="301" font-size="10.5" fill="#7a8899" text-anchor="middle">두 잔차항 모두 R행에만 적용 · F행 불변 · 전부 행 단위 lookup 이라 배치 구성과 무관</text>

  <!-- LB journey -->
  <text x="40" y="360" font-size="13.5" font-weight="700" fill="#1e3a5f">Public LB 여정</text>
  <line x1="40" y1="452" x2="1160" y2="452" stroke="#d3dfec" stroke-width="1.5"/>

  <!-- polyline scaled: x 90..1110, y 440(549) -> 385(1149) -->
  <polyline points="96,441 240,412 420,398 560,396 700,382 800,376 880,371 940,368 1000,364 1104,358"
            fill="none" stroke="#2d5a8c" stroke-width="2.5"/>

  <g font-size="10.5" fill="#5b6b7f" text-anchor="middle">
    <circle cx="96" cy="441" r="4.5" fill="#94a7bd"/><text x="96" y="470">549</text><text x="96" y="484" font-size="9.5" fill="#94a7bd">RF baseline</text>
    <circle cx="240" cy="412" r="4.5" fill="#94a7bd"/><text x="240" y="470">899</text><text x="240" y="484" font-size="9.5" fill="#94a7bd">GBDT 단일</text>
    <circle cx="420" cy="398" r="4.5" fill="#94a7bd"/><text x="420" y="470">1041</text><text x="420" y="484" font-size="9.5" fill="#94a7bd">잔차백본</text>
    <circle cx="560" cy="396" r="4.5" fill="#94a7bd"/><text x="560" y="470">1048</text><text x="560" y="484" font-size="9.5" fill="#94a7bd">F 트리 병합</text>
    <circle cx="700" cy="382" r="4.5" fill="#94a7bd"/><text x="700" y="470">1121</text><text x="700" y="484" font-size="9.5" fill="#94a7bd">anchor 도입</text>
    <circle cx="800" cy="376" r="4.5" fill="#2f855a"/><text x="800" y="470" fill="#2f855a">1135</text><text x="800" y="484" font-size="9.5" fill="#94a7bd">+B1 s=.50</text>
    <circle cx="940" cy="368" r="4.5" fill="#b7791f"/><text x="940" y="470" fill="#b7791f">1148</text><text x="940" y="484" font-size="9.5" fill="#94a7bd">+rm β=−.10</text>
  </g>
  <circle cx="1104" cy="358" r="6.5" fill="#c53030"/>
  <text x="1104" y="340" font-size="14" font-weight="700" fill="#c53030" text-anchor="middle">1,149.33</text>
  <text x="1104" y="470" font-size="10.5" fill="#c53030" text-anchor="middle" font-weight="600">β=−.15</text>
  <text x="1104" y="484" font-size="9.5" fill="#94a7bd" text-anchor="middle">최종</text>

  <!-- footer stats -->
  <g transform="translate(40,506)">
    <rect x="0" y="0" width="266" height="38" rx="7" fill="#fff" stroke="#d3dfec"/>
    <text x="14" y="16" font-size="10" fill="#7a8899">최종 순위</text>
    <text x="14" y="32" font-size="13" font-weight="700" fill="#1e3a5f">88위 / 2,403명 · 상위 3.66%</text>

    <rect x="286" y="0" width="266" height="38" rx="7" fill="#fff" stroke="#d3dfec"/>
    <text x="300" y="16" font-size="10" fill="#7a8899">평가 지표</text>
    <text x="300" y="32" font-size="13" font-weight="700" fill="#1e3a5f">Brier Skill Score</text>

    <rect x="572" y="0" width="266" height="38" rx="7" fill="#fff" stroke="#d3dfec"/>
    <text x="586" y="16" font-size="10" fill="#7a8899">마지막 5일 상승폭</text>
    <text x="586" y="32" font-size="13" font-weight="700" fill="#2f855a">+101.3 (1,048 → 1,149)</text>

    <rect x="858" y="0" width="262" height="38" rx="7" fill="#fff" stroke="#d3dfec"/>
    <text x="872" y="16" font-size="10" fill="#7a8899">제출 실험</text>
    <text x="872" y="32" font-size="13" font-weight="700" fill="#1e3a5f">31개 계열 · 사전등록 게이트</text>
  </g>

  <text x="1160" y="548" font-size="9.5" fill="#aab6c4" text-anchor="end">임시 도식 — 최종본 교체 예정</text>
</svg>
