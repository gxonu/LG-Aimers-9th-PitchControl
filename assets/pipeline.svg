<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">LG Aimers 9 — Pitch Control inference pipeline</title>
  <desc id="desc">Pre-pitch features feed an anchor and an independent backbone. For R rows, B1 uses pre-gate anchor and independent backbone predictions, followed by a centered risk_middle correction. F rows bypass both residuals. Both segments receive fixed logit calibration to produce control-success probabilities. Public leaderboard: 1,149.33, rank 88 of 2,403.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#A50034"/></marker>
    <marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#79736F"/></marker>
    <marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#FD312E"/></marker>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #292323; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; } .small { font-size: 14px; }
      .muted { fill: #716865; } .red { fill: #A50034; } .white { fill: #FFFFFF; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .flow { fill: none; stroke: #A50034; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .support { fill: none; stroke: #79736F; stroke-width: 2; stroke-dasharray: 5 5; stroke-linejoin: round; marker-end: url(#muted-arrow); }
    </style>
  </defs>
  <!-- LG Heritage Red / Active Red / Warm Grey; self-contained SVG. -->
  <rect width="1200" height="820" rx="24" fill="#F0ECE4"/>
  <rect x="1" y="1" width="1198" height="818" rx="23" fill="none" stroke="#DFD8CF"/>
  <rect x="40" y="40" width="5" height="100" rx="2.5" fill="#A50034"/>
  <text x="64" y="56" class="eyebrow red">LG AIMERS 9 · KBO BASEBALL</text>
  <text x="62" y="103" font-size="42" font-weight="700" letter-spacing="-1.5">Pitch Control</text>
  <text x="64" y="135" font-size="18" class="muted">Pre-pitch information. Calibrated probabilities.</text>
  <rect x="874" y="36" width="286" height="112" rx="18" fill="#A50034"/>
  <text x="896" y="61" class="eyebrow white">PUBLIC LEADERBOARD</text>
  <text x="894" y="103" font-size="36" font-weight="700" class="white">1,149.33</text>
  <text x="896" y="128" class="small white">88 / 2,403 participants · Top 3.66%</text>
  <line x1="40" y1="173" x2="1160" y2="173" stroke="#D8D0C6"/>
  <text x="40" y="210" class="eyebrow muted">INFERENCE ARCHITECTURE</text>
  <text x="40" y="238" class="body muted">Frozen training assets · Row-independent inference</text>

  <!-- B1 supporting inputs: separate backbone and pre-gate anchor score. -->
  <rect x="548" y="204" width="224" height="72" rx="12" fill="#FFFFFF" stroke="#D9D1C8"/>
  <text x="566" y="232" font-size="15" font-weight="700">Independent backbone</text>
  <text x="566" y="257" class="small muted">exp025B · pre-calibration</text>
  <text x="660" y="309" class="small muted mono">p_ours</text>

  <rect x="40" y="385" width="160" height="136" rx="16" fill="#FFFFFF" stroke="#D9D1C8"/>
  <text x="58" y="414" class="eyebrow muted">INPUT</text>
  <text x="58" y="445" font-size="18" font-weight="700">2025 pitches</text>
  <text x="58" y="472" class="body muted">Pre-pitch features</text>
  <text x="58" y="499" class="small muted">245,789 rows</text>
  <path d="M200 452 H228" class="flow"/>
  <rect x="228" y="340" width="252" height="250" rx="16" fill="#FFFFFF" stroke="#D7C0C5"/>
  <rect x="248" y="360" width="32" height="32" rx="10" fill="#A50034"/>
  <text x="264" y="382" text-anchor="middle" class="small white" font-weight="700">01</text>
  <text x="292" y="382" class="heading">Anchor</text>
  <text x="248" y="418" class="body">Hierarchical base</text>
  <text x="248" y="444" class="body">3 CatBoost channels</text>
  <text x="248" y="470" class="body">3 failure-risk predictions</text>
  <text x="248" y="497" class="body" font-weight="700">Stack → adaptive gate</text>
  <line x1="248" y1="519" x2="460" y2="519" stroke="#E8E0DC"/>
  <text x="248" y="548" class="small muted">Reuse a failure-risk signal</text>
  <text x="248" y="573" class="body mono red">risk_middle</text>

  <rect x="540" y="340" width="364" height="224" rx="18" fill="#FAF3F2" stroke="#E5C8CE"/>
  <text x="758" y="369" class="eyebrow red">R ONLY</text>
  <rect x="560" y="390" width="144" height="128" rx="12" fill="#FFFFFF" stroke="#D7C0C5"/>
  <text x="576" y="416" class="small red" font-weight="700">02</text>
  <text x="576" y="444" font-size="18" font-weight="700">B1 residual</text>
  <text x="576" y="473" class="body mono red">s = 0.50</text>
  <text x="576" y="499" class="small muted">Add → clip</text>
  <rect x="740" y="390" width="144" height="128" rx="12" fill="#A50034"/>
  <text x="756" y="416" class="small white" font-weight="700">03</text>
  <text x="756" y="444" font-size="18" font-weight="700" class="white">rm residual</text>
  <text x="756" y="473" class="body mono white">β = −0.15</text>
  <text x="756" y="499" class="small white">Add → clip</text>
  <text x="560" y="546" class="small muted">Regular season · two residual corrections</text>
  <path d="M480 452 H560" class="flow"/>
  <path d="M704 452 H740" class="flow"/>
  <path d="M884 452 H956" class="flow"/>
  <circle cx="514" cy="452" r="4" fill="#A50034"/>

  <!-- Signal reuse; F bypasses residuals but still receives calibration. -->
  <path d="M354 590 V624 H504" fill="none" stroke="#FD312E" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M524 624 H916 V492 H884" fill="none" stroke="#FD312E" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#signal-arrow)"/>
  <rect x="550" y="609" width="232" height="30" rx="10" fill="#F0ECE4"/>
  <text x="666" y="630" text-anchor="middle" class="small red mono">risk_middle − 0.169</text>
  <path d="M514 452 V680 H930 V482 H956" class="support"/>
  <rect x="573" y="665" width="300" height="30" rx="10" fill="#F0ECE4"/>
  <text x="723" y="686" text-anchor="middle" class="body muted">F rows · bypass both residuals</text>

  <rect x="956" y="340" width="204" height="178" rx="16" fill="#FFFFFF" stroke="#D7C0C5"/>
  <rect x="976" y="360" width="32" height="32" rx="10" fill="#A50034"/>
  <text x="992" y="382" text-anchor="middle" class="small white" font-weight="700">04</text>
  <text x="976" y="422" class="heading">Calibration</text>
  <text x="976" y="450" class="body muted">Fixed logit shift</text>
  <text x="976" y="478" class="body mono red">b_R / b_F</text>
  <text x="976" y="501" class="small muted">Segment-specific</text>
  <path d="M1058 518 V563" class="flow"/>
  <rect x="956" y="563" width="204" height="89" rx="16" fill="#292323"/>
  <text x="976" y="589" class="eyebrow white">OUTPUT</text>
  <text x="976" y="617" font-size="15" class="mono white">P(control_success)</text>
  <text x="976" y="639" font-size="13" style="fill:#D8D0C6">One probability per pitch</text>
  <!-- Draw supporting connectors above card backgrounds; gaps mark crossings. -->
  <path d="M120 385 V285 H520 V240 H548" class="support"/>
  <text x="156" y="278" class="small muted">Same pre-pitch features</text>
  <path d="M648 276 V390" class="support"/>
  <path d="M480 488 H498 V462" class="support" style="marker-end:none"/>
  <path d="M498 442 V305 H596 V390" class="support"/>
  <rect x="511" y="289" width="118" height="24" rx="8" fill="#F0ECE4"/>
  <text x="570" y="306" text-anchor="middle" class="small muted">pre-gate score</text>
  <line x1="40" y1="733" x2="1160" y2="733" stroke="#D8D0C6"/>
  <path d="M40 767 H72" class="flow"/>
  <text x="84" y="772" class="small muted">Prediction flow</text>
  <path d="M240 767 H272" class="support"/>
  <text x="284" y="772" class="small muted">Supporting input / bypass</text>
  <text x="1160" y="772" text-anchor="end" class="small muted">exp031h · Inference ≈ 1.5 min / 10 min limit</text>
</svg>
